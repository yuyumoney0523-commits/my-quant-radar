<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資雷達站 · 全功能量化真實數據終端 FINAL TERMINAL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg-base: #080c14;
    --bg-panel: #0d1420;
    --bg-card: #111827;
    --bg-hover: #162033;
    --border: #1e2d45;
    --border-bright: #2a3f5f;
    --accent-cyan: #00d4ff;
    --accent-green: #00e59b;
    --accent-red: #ff4466;
    --accent-yellow: #ffd447;
    --accent-purple: #a78bfa;
    --text-primary: #e8f0fe;
    --text-secondary: #7a8fa8;
    --text-dim: #3d5066;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* 終端機微電子掃描線濾鏡 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.02) 2px,
      rgba(0,0,0,0.02) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Header */
  .header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent-cyan);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-logo .dot {
    width: 8px; height: 8px;
    background: var(--accent-green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,229,155,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(0,229,155,0); }
  }

  .header-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-badge {
    background: rgba(0,229,155,0.1);
    border: 1px solid rgba(0,229,155,0.3);
    color: var(--accent-green);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 0.1em;
  }

  /* INDEX TOP BAR */
  .index-bar {
    display: flex;
    gap: 24px;
    padding: 10px 24px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .index-item { display: flex; flex-direction: column; gap: 1px; min-width: 130px; }
  .index-name { font-size: 10px; color: var(--text-dim); letter-spacing: 0.05em; text-transform: uppercase; }
  .index-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }
  .index-chg { font-family: 'JetBrains Mono', monospace; font-size: 11px; }

  /* 主要佈局 */
  .main { padding: 16px 24px; display: flex; flex-direction: column; gap: 20px; }

  /* 區塊標籤 */
  .section-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--text-secondary);
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .section-label::before {
    content: '';
    width: 3px; height: 14px;
    border-radius: 1px;
  }

  .section-label.cyan::before { background: var(--accent-cyan); }
  .section-label.green::before { background: var(--accent-green); }
  .section-label.purple::before { background: var(--accent-purple); }

  /* 面板容器 */
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
  }

  .panel.cyan::before { background: linear-gradient(90deg, var(--accent-cyan), transparent); }
  .panel.green::before { background: linear-gradient(90deg, var(--accent-green), transparent); }
  .panel.purple::before { background: linear-gradient(90deg, var(--accent-purple), transparent); }

  /* Grid 佈局 */
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-flow { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .grid-etf { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }

  /* 卡片 */
  .stat-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 16px;
  }

  .stat-label { font-size: 10px; color: var(--text-secondary); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-sub { font-size: 11px; color: var(--text-secondary); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }
  
  .up { color: var(--accent-green); }
  .down { color: var(--accent-red); }
  .neutral { color: var(--accent-yellow); }
  .cyan-text { color: var(--accent-cyan); }

  .ratio-bar { height: 8px; border-radius: 2px; overflow: hidden; background: var(--bg-base); margin: 8px 0; }
  .ratio-fill { height: 100%; display: flex; }
  .ratio-bull { background: var(--accent-green); transition: width 0.5s; }
  .ratio-bear { background: var(--accent-red); transition: width 0.5s; }

  .flow-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .flow-item:last-child { border-bottom: none; }
  .flow-bar-wrap { width: 80px; height: 6px; background: var(--bg-base); border-radius: 2px; overflow: hidden; }
  .flow-bar { height: 100%; border-radius: 2px; }

  /* 表格 */
  .table-responsive { width: 100%; overflow-x: auto; }
  .data-table { width: 100%; border-collapse: collapse; min-width: 600px; }
  .data-table th {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
    padding: 10px;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    border-bottom: 1px solid var(--border);
    background: rgba(13, 20, 32, 0.5);
  }
  .data-table th:first-child { text-align: left; }
  .data-table td {
    padding: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
  }
  .data-table td:first-child { text-align: left; }
  .data-table tbody tr { transition: background 0.15s; }
  .data-table tbody tr:hover { background: var(--bg-hover); }

  .premium { color: var(--accent-green); font-weight: bold; }
  .discount { color: var(--accent-red); font-weight: bold; }
  .etf-badge { font-size: 10px; padding: 2px 6px; border-radius: 2px; font-family: 'JetBrains Mono', monospace; }
  .badge-buy { background: rgba(0,229,155,0.15); color: var(--accent-green); border: 1px solid rgba(0,229,155,0.3); }
  .badge-sell { background: rgba(255,68,102,0.15); color: var(--accent-red); border: 1px solid rgba(255,68,102,0.3); }
  .badge-hold { background: rgba(255,212,71,0.1); color: var(--accent-yellow); border: 1px solid rgba(255,212,71,0.3); }

  .weight-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .weight-bar:last-child { border-bottom: none; }
  .weight-track { flex: 1; height: 5px; background: var(--bg-base); border-radius: 2px; overflow: hidden; }
  .weight-fill { height: 100%; border-radius: 2px; background: var(--accent-cyan); }

  /* 篩選器面版 */
  .filter-panel {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .filter-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .filter-item:hover { border-color: var(--border-bright); background: var(--bg-hover); }
  .filter-item.active { border-color: rgba(0,212,255,0.5); background: rgba(0,212,255,0.06); }

  .filter-check {
    width: 14px; height: 14px;
    border-radius: 2px;
    border: 1px solid var(--border-bright);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-size: 9px;
    font-weight: bold;
  }
  .filter-item.active .filter-check {
    background: var(--accent-cyan);
    border-color: var(--accent-cyan);
    color: #080c14;
  }
  .filter-text { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
  .filter-item.active .filter-text { color: var(--text-primary); }

  .run-btn {
    background: var(--accent-cyan);
    color: #080c14;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 10px 24px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .run-btn:hover { background: #33ddff; box-shadow: 0 0 15px rgba(0,212,255,0.4); }

  .strategy-btn {
    font-size: 11px; padding: 4px 10px; background: var(--bg-base); 
    border: 1px solid var(--border); color: var(--text-secondary); 
    border-radius: 2px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
  }
  .strategy-btn:hover { border-color: var(--border-bright); color: var(--text-primary); }

  .source-badge {
    font-size: 10px; padding: 3px 8px; background: #1f2937; border: 1px solid var(--border);
    border-radius: 3px; color: var(--text-secondary); cursor: pointer; font-family: 'JetBrains Mono', monospace;
  }
  .source-badge.active {
    background: rgba(0, 229, 155, 0.15); border-color: var(--accent-green); color: var(--accent-green); font-weight: bold;
  }

  .vol-bar { width: 50px; height: 4px; background: var(--bg-base); border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
  .vol-fill { height: 100%; border-radius: 2px; background: var(--accent-purple); }

  @media (max-width: 950px) {
    .grid-3, .grid-flow, .grid-etf { grid-template-columns: 1fr; }
    .filter-panel { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .filter-panel { grid-template-columns: 1fr; }
  }
</style>
</head>
