<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資雷達站 · 全功能量化真實數據終端 FINAL PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg-base: #080c14;
    --bg-panel: #0d1420;
    --bg-card: #111827;
    --bg-hover: #162033;
    --border: #1e2d45;
    --border-bright: #2a3f5f;
    --accent-cyan: #00d4ff;
    --accent-green: #00e59b;
    --accent-red: #ff4466;
    --accent-yellow: #ffd447;
    --accent-purple: #a78bfa;
    --text-primary: #e8f0fe;
    --text-secondary: #7a8fa8;
    --text-dim: #3d5066;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* 終端機微電子掃描線濾鏡 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.02) 2px,
      rgba(0,0,0,0.02) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Header */
  .header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent-cyan);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-logo .dot {
    width: 8px; height: 8px;
    background: var(--accent-green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,229,155,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(0,229,155,0); }
  }

  .header-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-badge {
    background: rgba(0,229,155,0.1);
    border: 1px solid rgba(0,229,155,0.3);
    color: var(--accent-green);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 0.1em;
  }

  /* INDEX TOP BAR */
  .index-bar {
    display: flex;
    gap: 24px;
    padding: 10px 24px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .index-item { display: flex; flex-direction: column; gap: 1px; min-width: 130px; }
  .index-name { font-size: 10px; color: var(--text-dim); letter-spacing: 0.05em; text-transform: uppercase; }
